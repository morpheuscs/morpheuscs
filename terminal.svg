<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270">
  <style>
    .line {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 13.5px;
      white-space: pre;
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
    }
    .l1 { animation: type 1.2s steps(40, end) 0.2s forwards; }
    .l2 { animation: type 1.0s steps(45, end) 1.5s forwards; }
    .l3 { animation: type 1.4s steps(52, end) 2.7s forwards; }
    .l4 { animation: type 1.0s steps(44, end) 4.2s forwards; }
    .l5 { animation: type 1.4s steps(52, end) 5.4s forwards; }
    .l6 { animation: type 1.0s steps(40, end) 6.9s forwards; }
    .l7 { animation: type 1.4s steps(54, end) 8.1s forwards; }
    .l8 { animation: type 0.8s steps(36, end) 9.6s forwards; }
    @keyframes type {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }
  </style>

  <rect width="760" height="270" rx="8" fill="#000000" stroke="#1e293b" stroke-width="1.5"/>
